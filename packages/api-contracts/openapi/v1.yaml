openapi: 3.1.0
info:
  title: Portfolio Research Assistant API
  version: 1.2.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Version 1 operational, Authentication, Portfolio, Asset, and immutable
    Transaction Ledger contracts. Authentication assists access control only;
    M3 financial scope is limited to recording and reading approved immutable
    ledger facts, not holdings, prices, valuations, allocations, or dashboards.
servers:
  - url: https://app.localhost:3443/api/v1
    description: Approved local same-origin HTTPS development endpoint
security: []
tags:
  - name: Operations
    description: Restricted operational checks.
  - name: Authentication
    description: Email/password Authentication and current-session lifecycle.
  - name: Portfolios
    description: Authenticated management of user-owned Portfolio records.
  - name: Assets
    description: Authenticated discovery of system-managed canonical Assets.
  - name: Transactions
    description: Authenticated immutable Transaction Ledger history and corrections.
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Operations]
      summary: Report process liveness
      responses:
        "200":
          description: The API process is alive.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Report required dependency readiness
      responses:
        "200":
          description: The API can reach required dependencies.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A required dependency is unavailable.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/register:
    post:
      operationId: registerUser
      tags: [Authentication]
      summary: Register with email and password
      description: >-
        Creates an active user and refresh session. On success, sets the
        host-only pra_rt_v1 cookie with Secure, HttpOnly, SameSite=Lax, and
        Path=/api/v1/auth. The raw refresh token is never returned in JSON.
        Production requires HTTPS. A rejection never confirms whether the
        normalized email is already registered.
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "201":
          description: User registered and Authentication session established.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/RegistrationRejected"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalFailure"
        "503":
          $ref: "#/components/responses/AuthServiceUnavailable"
  /auth/login:
    post:
      operationId: loginUser
      tags: [Authentication]
      summary: Authenticate with email and password
      description: >-
        On success, establishes a refresh session and sets the host-only
        pra_rt_v1 cookie with Secure, HttpOnly, SameSite=Lax, and
        Path=/api/v1/auth. Unknown email, disabled account, and incorrect
        password all return the same AUTHENTICATION_FAILED response.
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: Authentication succeeded and a session was established.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalFailure"
        "503":
          $ref: "#/components/responses/AuthServiceUnavailable"
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Authentication]
      summary: Rotate the refresh session
      description: >-
        Accepts the opaque refresh token only through the Secure HttpOnly
        pra_rt_v1 cookie. The request must use same-origin HTTPS, an Origin
        exactly matching AUTH_PUBLIC_ORIGIN, and X-Requested-With:
        portfolio-web. Successful rotation replaces the cookie using the same
        host-only attributes and never returns refresh/session internals.
      security:
        - RefreshCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/RequiredOrigin"
        - $ref: "#/components/parameters/RequestedWith"
      responses:
        "200":
          description: Refresh token rotated and a new access token issued.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/RefreshRejected"
        "403":
          $ref: "#/components/responses/BrowserSecurityRejected"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalFailure"
        "503":
          $ref: "#/components/responses/AuthServiceUnavailable"
  /auth/logout:
    post:
      operationId: logoutSession
      tags: [Authentication]
      summary: Revoke the current Authentication session
      description: >-
        Accepts the refresh token only through the Secure HttpOnly pra_rt_v1
        cookie. Requires same-origin HTTPS, an Origin exactly matching
        AUTH_PUBLIC_ORIGIN, and X-Requested-With: portfolio-web. Revokes the
        current session and clears the cookie using the same host-only,
        Secure, HttpOnly, SameSite=Lax, and Path=/api/v1/auth attributes. No
        token value is returned.
      security:
        - RefreshCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/RequiredOrigin"
        - $ref: "#/components/parameters/RequestedWith"
      responses:
        "204":
          description: Current Authentication session revoked; no response body.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Set-Cookie:
              $ref: "#/components/headers/ClearRefreshCookie"
        "401":
          $ref: "#/components/responses/RefreshRejected"
        "403":
          $ref: "#/components/responses/BrowserSecurityRejected"
        "500":
          $ref: "#/components/responses/InternalFailure"
        "503":
          $ref: "#/components/responses/AuthServiceUnavailable"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Return the current authenticated user
      description: >-
        Uses a Bearer access JWT. The backend response is authoritative for
        authenticated identity; clients must not treat parsed JWT claims as
        authoritative permissions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
      responses:
        "200":
          description: Safe authenticated-user representation.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "500":
          $ref: "#/components/responses/InternalFailure"
  /portfolios:
    post:
      operationId: createPortfolio
      tags: [Portfolios]
      summary: Create a user-owned Portfolio
      description: >-
        Creates an ACTIVE Portfolio for the authenticated principal. The owner
        is derived from the access token; ownership fields are not accepted.
        baseCurrency is constrained to USD and becomes immutable. Portfolio
        names are trimmed, compared case-insensitively per owner, and must be
        unique among that owner's ACTIVE Portfolios.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioRequest"
      responses:
        "201":
          description: Portfolio created.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "409":
          $ref: "#/components/responses/PortfolioNameConflict"
        "500":
          $ref: "#/components/responses/InternalFailure"
    get:
      operationId: listPortfolios
      tags: [Portfolios]
      summary: List the authenticated user's Portfolios
      description: >-
        Returns only Portfolios owned by the authenticated principal. ACTIVE is
        the default lifecycle filter; pass status=ARCHIVED to list archived
        Portfolios. Results are ordered by updatedAt descending, then id
        ascending. M2 does not paginate the expected small owner-scoped set.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/PortfolioStatusFilter"
      responses:
        "200":
          description: Owner-scoped Portfolio list.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "500":
          $ref: "#/components/responses/InternalFailure"
  /portfolios/{portfolioId}:
    get:
      operationId: getPortfolio
      tags: [Portfolios]
      summary: Get one owned Portfolio
      description: >-
        Returns a Portfolio only when it belongs to the authenticated
        principal. An absent Portfolio and a Portfolio owned by someone else
        both return the same PORTFOLIO_NOT_FOUND response.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: Owned Portfolio.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "404":
          $ref: "#/components/responses/PortfolioNotFound"
        "500":
          $ref: "#/components/responses/InternalFailure"
    patch:
      operationId: updatePortfolio
      tags: [Portfolios]
      summary: Update an owned active Portfolio
      description: >-
        Updates only the Portfolio name. ID, owner, baseCurrency, status,
        archivedAt, and lifecycle timestamps are immutable through this
        operation. The normalized name must remain unique among the
        authenticated owner's ACTIVE Portfolios; conflicts use
        PORTFOLIO_NAME_CONFLICT. Updating an ARCHIVED Portfolio is rejected.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/PortfolioId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePortfolioRequest"
      responses:
        "200":
          description: Active Portfolio updated.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "404":
          $ref: "#/components/responses/PortfolioNotFound"
        "409":
          $ref: "#/components/responses/PortfolioNameConflict"
        "422":
          $ref: "#/components/responses/PortfolioArchived"
        "500":
          $ref: "#/components/responses/InternalFailure"
  /portfolios/{portfolioId}/archive:
    post:
      operationId: archivePortfolio
      tags: [Portfolios]
      summary: Archive an owned Portfolio
      description: >-
        Explicitly transitions an owned ACTIVE Portfolio to ARCHIVED; it never
        hard-deletes the record. The operation is idempotent from the client's
        perspective: retrying archive for an already archived owned Portfolio
        returns its same ARCHIVED representation. There is no restore operation.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: Portfolio archived, or its existing archived representation returned on retry.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "404":
          $ref: "#/components/responses/PortfolioNotFound"
        "500":
          $ref: "#/components/responses/InternalFailure"
  /portfolios/{portfolioId}/transactions:
    post:
      operationId: createTransaction
      tags: [Transactions]
      summary: Record one immutable Transaction
      description: >-
        Records one immutable ledger fact for an owned ACTIVE Portfolio. The
        owner is derived from the Bearer access token; portfolioId is route
        scope only and ownership fields are not accepted. This command requires
        Idempotency-Key in the transaction.create.v1 scope. An identical replay
        returns the previously committed result without creating another
        financial fact; reuse with a different command returns
        IDEMPOTENCY_CONFLICT. The request body is limited to 8,192 UTF-8 bytes.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/PortfolioId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        x-max-bytes: 8192
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCommand"
      responses:
        "201":
          description: Immutable Transaction recorded, or a previously committed identical idempotent result returned.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/InvalidTransactionRequest"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "404":
          $ref: "#/components/responses/PortfolioNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          $ref: "#/components/responses/TransactionCommandRejected"
        "500":
          $ref: "#/components/responses/InternalFailure"
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: List immutable Transaction Ledger history
      description: >-
        Returns owner-scoped immutable ledger history ordered by effectiveAt
        descending, portfolioSequence descending, then transactionId descending.
        The opaque cursor is a versioned encoding of that full ordering tuple;
        clients must not parse or construct it. effectiveAtFrom and
        effectiveAtTo are inclusive UTC-Z bounds and must satisfy from <= to.
        includeReversals defaults to true; false excludes only internal
        REVERSAL rows while retaining correction links on visible records.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/PortfolioId"
        - $ref: "#/components/parameters/TransactionKindFilter"
        - $ref: "#/components/parameters/TransactionEffectiveAtFrom"
        - $ref: "#/components/parameters/TransactionEffectiveAtTo"
        - $ref: "#/components/parameters/TransactionIncludeReversals"
        - $ref: "#/components/parameters/TransactionCursor"
        - $ref: "#/components/parameters/TransactionPageLimit"
      responses:
        "200":
          description: Owner-scoped page of immutable Transaction Ledger history.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "400":
          $ref: "#/components/responses/InvalidTransactionRequest"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "404":
          $ref: "#/components/responses/PortfolioNotFound"
        "500":
          $ref: "#/components/responses/InternalFailure"
  /portfolios/{portfolioId}/transactions/{transactionId}:
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: Get one immutable Transaction
      description: >-
        Returns an immutable Transaction only when both its Portfolio and the
        Transaction belong to the authenticated principal. An absent,
        cross-owner, or unrepresentable opaque transactionId returns the same
        TRANSACTION_NOT_FOUND response.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/PortfolioId"
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Owner-scoped immutable Transaction with correction relationships.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "500":
          $ref: "#/components/responses/InternalFailure"
  /portfolios/{portfolioId}/transactions/{transactionId}/corrections:
    post:
      operationId: correctTransaction
      tags: [Transactions]
      summary: Correct one immutable Transaction by reversal and replacement
      description: >-
        Atomically records one internal REVERSAL and one complete public
        replacement Transaction for the path target; it never mutates or
        deletes the original. This command requires Idempotency-Key in the
        transaction.correct.v1 scope. An identical replay returns the previously
        committed correction result and creates no new financial fact. A target
        with an existing direct reversal returns TRANSACTION_ALREADY_CORRECTED.
        The request body is limited to 8,192 UTF-8 bytes.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/PortfolioId"
        - $ref: "#/components/parameters/TransactionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        x-max-bytes: 8192
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCorrectionCommand"
      responses:
        "201":
          description: Atomic original, reversal, and replacement relationship recorded, or an identical idempotent result returned.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCorrectionResult"
        "400":
          $ref: "#/components/responses/InvalidTransactionRequest"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "409":
          $ref: "#/components/responses/TransactionCorrectionConflict"
        "422":
          $ref: "#/components/responses/TransactionCommandRejected"
        "500":
          $ref: "#/components/responses/InternalFailure"
  /assets:
    get:
      operationId: listAssets
      tags: [Assets]
      summary: Search supported canonical Assets
      description: >-
        Returns system-managed canonical Asset metadata available to every
        authenticated user. search is case-insensitive discovery over canonical
        symbol and display name. type is an exact supported AssetType filter.
        Results are ordered by symbol, exchange, then id ascending; cursor is
        opaque and preserves that ordering. No user can mutate the catalog.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/AssetSearch"
        - $ref: "#/components/parameters/AssetTypeFilter"
        - $ref: "#/components/parameters/AssetCursor"
        - $ref: "#/components/parameters/AssetPageLimit"
      responses:
        "200":
          description: Page of supported canonical Assets.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "500":
          $ref: "#/components/responses/InternalFailure"
  /assets/{assetId}:
    get:
      operationId: getAsset
      tags: [Assets]
      summary: Get supported canonical Asset metadata
      description: >-
        Returns only public metadata for a supported canonical Asset. It does
        not return provider, venue-price, holding, transaction, or valuation
        data. For CRYPTO, exchange uses the canonical CRYPTO market namespace,
        not a trading venue such as COINBASE or BINANCE.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Supported canonical Asset.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "404":
          $ref: "#/components/responses/AssetNotFound"
        "500":
          $ref: "#/components/responses/InternalFailure"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Fifteen-minute Ed25519/EdDSA access JWT used only for API authorization.
        Browser clients keep it in memory only; parsed claims are not
        authoritative application permissions.
    RefreshCookieAuth:
      type: apiKey
      in: cookie
      name: pra_rt_v1
      description: >-
        Opaque refresh token supplied only by the browser as the host-only
        Secure, HttpOnly, SameSite=Lax cookie scoped to /api/v1/auth. The cookie
        has no Domain attribute and production requires HTTPS.
  parameters:
    RequestCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional caller correlation identifier; the API validates or generates it.
      schema:
        $ref: "#/components/schemas/CorrelationIdValue"
    RequiredOrigin:
      name: Origin
      in: header
      required: true
      description: Must exactly equal the configured AUTH_PUBLIC_ORIGIN HTTPS origin.
      schema:
        type: string
        format: uri
    RequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: Required custom request header for refresh and logout CSRF protection.
      schema:
        type: string
        const: portfolio-web
    PortfolioId:
      name: portfolioId
      in: path
      required: true
      description: Immutable opaque Portfolio identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PortfolioStatusFilter:
      name: status
      in: query
      required: false
      description: >-
        Lifecycle filter. Defaults to ACTIVE; ARCHIVED must be requested
        explicitly. The API does not return another user's Portfolio in either
        case.
      schema:
        $ref: "#/components/schemas/PortfolioStatus"
        default: ACTIVE
    AssetId:
      name: assetId
      in: path
      required: true
      description: Immutable opaque canonical Asset identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AssetSearch:
      name: search
      in: query
      required: false
      description: >-
        Case-insensitive user-facing discovery query over canonical symbol and
        display name. It does not query providers or prices.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    AssetTypeFilter:
      name: type
      in: query
      required: false
      description: Exact supported canonical Asset type filter.
      schema:
        $ref: "#/components/schemas/AssetType"
    AssetCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous Asset list response.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    AssetPageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of Assets to return. Defaults to 25 and cannot exceed 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    TransactionId:
      name: transactionId
      in: path
      required: true
      description: Immutable opaque Transaction identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Opaque command key for one transaction command scope. It must be 16 to
        128 ASCII characters, start with an alphanumeric character, and use
        only letters, digits, dot, underscore, tilde, or hyphen. The API does
        not expose command scope or request fingerprints. Reusing one key with
        an identical command replays the committed result; reuse with a
        different command returns IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._~-]{15,127}$"
    TransactionKindFilter:
      name: kind
      in: query
      required: false
      description: Exact visible Transaction kind filter. REVERSAL is history-visible only.
      schema:
        $ref: "#/components/schemas/TransactionVisibleKind"
    TransactionEffectiveAtFrom:
      name: effectiveAtFrom
      in: query
      required: false
      description: Inclusive RFC 3339 UTC-Z lower bound for effectiveAt.
      schema:
        $ref: "#/components/schemas/EffectiveAt"
    TransactionEffectiveAtTo:
      name: effectiveAtTo
      in: query
      required: false
      description: Inclusive RFC 3339 UTC-Z upper bound for effectiveAt; must not precede effectiveAtFrom.
      schema:
        $ref: "#/components/schemas/EffectiveAt"
    TransactionIncludeReversals:
      name: includeReversals
      in: query
      required: false
      description: Include internal REVERSAL rows in history. Defaults to true.
      schema:
        type: boolean
        default: true
    TransactionCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque version-1 cursor from a previous Transaction history page. Its
        grammar is v1. followed by unpadded base64url encoding of the canonical
        UTF-8 JSON tuple [effectiveAt, portfolioSequence, transactionId]; it
        represents effectiveAt DESC, portfolioSequence DESC, transactionId DESC.
        Clients must not parse, modify, or construct it.
      schema:
        type: string
        minLength: 4
        maxLength: 512
        pattern: "^v1\\.[A-Za-z0-9_-]{1,509}$"
    TransactionPageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of Transactions to return. Defaults to 50 and cannot exceed 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    CorrelationId:
      description: Request correlation identifier, accepted from or generated for the request.
      schema:
        $ref: "#/components/schemas/CorrelationIdValue"
    SetRefreshCookie:
      description: >-
        Sets or rotates pra_rt_v1 with Secure, HttpOnly, SameSite=Lax,
        Path=/api/v1/auth, and no Domain attribute. Max-Age is the lesser of the
        30-day idle lifetime and remaining 90-day family lifetime.
      schema:
        type: string
    ClearRefreshCookie:
      description: >-
        Clears pra_rt_v1 with Max-Age=0 and the same Secure, HttpOnly,
        SameSite=Lax, host-only, and Path=/api/v1/auth attributes used to set it.
      schema:
        type: string
    RetryAfter:
      description: Seconds until the current rate-limit window permits another attempt.
      schema:
        type: integer
        minimum: 1
  schemas:
    CredentialsRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Login email; the backend trims surrounding whitespace and lowercases it.
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 1024
          description: >-
            Password with no composition rule. The backend enforces a maximum
            UTF-8 encoded input size of 1,024 bytes; JSON Schema maxLength is an
            additional character-count bound.
    AuthenticatedUser:
      type: object
      additionalProperties: false
      required: [id, email, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Immutable opaque user identifier.
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, disabled]
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    AccessTokenFields:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          minLength: 1
          description: Fifteen-minute Ed25519-signed JWT. Never contains a refresh token.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 900
          description: Access-token lifetime in seconds.
    AccessTokenResponse:
      description: >-
        Access-token result. Browser clients must keep accessToken in memory
        only and must never persist it or derive authoritative permissions from it.
      allOf:
        - $ref: "#/components/schemas/AccessTokenFields"
      unevaluatedProperties: false
    AuthenticatedSessionResponse:
      allOf:
        - $ref: "#/components/schemas/AccessTokenFields"
        - type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/AuthenticatedUser"
      unevaluatedProperties: false
    PortfolioStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
      description: ACTIVE Portfolios are editable; ARCHIVED Portfolios are retained and immutable in M2.
    PortfolioBaseCurrency:
      type: string
      const: USD
      description: The only approved M2 Portfolio base currency. It is immutable after creation.
    Portfolio:
      type: object
      additionalProperties: false
      required:
        [id, name, baseCurrency, status, archivedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Immutable opaque Portfolio identifier.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Portfolio display name. The backend trims surrounding whitespace and
            enforces case-insensitive active-name uniqueness per owner.
        baseCurrency:
          $ref: "#/components/schemas/PortfolioBaseCurrency"
        status:
          $ref: "#/components/schemas/PortfolioStatus"
        archivedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: Archive time for ARCHIVED Portfolios; null while ACTIVE.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    CreatePortfolioRequest:
      type: object
      additionalProperties: false
      required: [name, baseCurrency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Proposed Portfolio name. The backend trims surrounding whitespace;
            it preserves other whitespace/content semantics and is authoritative
            for uniqueness validation.
        baseCurrency:
          $ref: "#/components/schemas/PortfolioBaseCurrency"
      description: >-
        Owner identity is derived from the bearer token. ownerUserId, userId,
        lifecycle status, and financial state are not accepted.
    UpdatePortfolioRequest:
      type: object
      additionalProperties: false
      required: [name]
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: New display name for an ACTIVE Portfolio.
      description: >-
        M2 permits only name updates. ID, ownership, baseCurrency, status,
        archivedAt, and lifecycle timestamps are immutable.
    PortfolioListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Owner-scoped Portfolios in the documented stable order.
          items:
            $ref: "#/components/schemas/Portfolio"
    AssetType:
      type: string
      enum: [EQUITY, ETF, CRYPTO]
      description: >-
        Structural canonical instrument type. It is not a strategy, sector,
        industry, research classification, or risk classification.
    AssetCurrency:
      type: string
      const: USD
      description: >-
        Catalog currency metadata under the current USD-only policy. It is not
        a price, quote, holding, or authorization for CRYPTO financial processing.
    Asset:
      type: object
      additionalProperties: false
      required: [id, symbol, name, assetType, exchange, currency]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Immutable opaque canonical Asset identifier.
        symbol:
          type: string
          minLength: 1
          maxLength: 64
          description: User-facing canonical symbol; normalized persistence fields are not exposed.
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Canonical display name.
        assetType:
          $ref: "#/components/schemas/AssetType"
        exchange:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Canonical exchange or market namespace. CRYPTO Assets use CRYPTO,
            never a provider/trading venue identity.
        currency:
          $ref: "#/components/schemas/AssetCurrency"
    AssetListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        nextCursor:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 512
            - type: "null"
          description: Opaque cursor for the next stable page, or null when there is no next page.
    TransactionCreateKind:
      type: string
      enum: [BUY, SELL, DIVIDEND, DEPOSIT, WITHDRAWAL, FEE]
      description: User-creatable immutable Transaction kinds. REVERSAL is internal-only; ADJUSTMENT is reserved and unavailable.
    TransactionVisibleKind:
      type: string
      enum: [BUY, SELL, DIVIDEND, DEPOSIT, WITHDRAWAL, FEE, REVERSAL]
      description: History-visible Transaction kinds. REVERSAL appears only as an internal correction record; ADJUSTMENT is absent.
    TransactionCurrency:
      type: string
      const: USD
      description: The only approved M3 transaction currency.
    TransactionAssetId:
      type: string
      minLength: 1
      maxLength: 128
      description: >-
        Immutable opaque canonical Asset identifier. Backend validation requires
        an existing USD EQUITY or ETF on NYSE, NASDAQ, NYSEARCA, or AMEX.
        CRYPTO remains searchable in M2 but is financially ineligible in M3.
    DecimalString:
      type: string
      description: Decimal transport value. Binary floating-point JSON numbers are prohibited.
      pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,12})?$"
    PositiveDecimalString:
      type: string
      description: Strictly positive decimal string with at most 12 fractional digits.
      pattern: "^(?:[1-9][0-9]*(?:\\.[0-9]{1,12})?|0\\.(?=[0-9]{1,12}$)(?=[0-9]*[1-9])[0-9]+)$"
    NonNegativeDecimalString:
      type: string
      description: Zero or positive decimal string with at most 12 fractional digits.
      pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,12})?$"
    EffectiveAt:
      type: string
      format: date-time
      description: >-
        RFC 3339 UTC instant with a literal Z suffix and zero to six fractional
        digits. Lexical validation happens at request parsing; a syntactically
        valid future time is rejected later as INVALID_EFFECTIVE_AT, and a
        backdated time is permitted only if whole-ledger replay remains valid.
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?Z$"
    TransactionNote:
      type: string
      maxLength: 2000
      description: Optional user note. The command-body UTF-8 limit still applies.
    TransactionExternalReference:
      type: string
      maxLength: 256
      description: Optional user-supplied external reference; it is not an ownership or idempotency proof.
    BuyTransactionCommand:
      type: object
      additionalProperties: false
      required: [kind, assetId, quantity, unitPrice, currency, effectiveAt]
      properties:
        kind:
          type: string
          const: BUY
        assetId:
          $ref: "#/components/schemas/TransactionAssetId"
        quantity:
          $ref: "#/components/schemas/PositiveDecimalString"
        unitPrice:
          $ref: "#/components/schemas/PositiveDecimalString"
        fee:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        currency:
          $ref: "#/components/schemas/TransactionCurrency"
        effectiveAt:
          $ref: "#/components/schemas/EffectiveAt"
        note:
          $ref: "#/components/schemas/TransactionNote"
        externalReference:
          $ref: "#/components/schemas/TransactionExternalReference"
      description: BUY requires assetId, quantity, and unitPrice. fee is optional and defaults semantically to zero; amount is forbidden.
    SellTransactionCommand:
      type: object
      additionalProperties: false
      required: [kind, assetId, quantity, unitPrice, currency, effectiveAt]
      properties:
        kind:
          type: string
          const: SELL
        assetId:
          $ref: "#/components/schemas/TransactionAssetId"
        quantity:
          $ref: "#/components/schemas/PositiveDecimalString"
        unitPrice:
          $ref: "#/components/schemas/PositiveDecimalString"
        fee:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        currency:
          $ref: "#/components/schemas/TransactionCurrency"
        effectiveAt:
          $ref: "#/components/schemas/EffectiveAt"
        note:
          $ref: "#/components/schemas/TransactionNote"
        externalReference:
          $ref: "#/components/schemas/TransactionExternalReference"
      description: SELL requires assetId, quantity, and unitPrice. fee is optional and defaults semantically to zero; amount is forbidden.
    DividendTransactionCommand:
      type: object
      additionalProperties: false
      required: [kind, assetId, amount, currency, effectiveAt]
      properties:
        kind:
          type: string
          const: DIVIDEND
        assetId:
          $ref: "#/components/schemas/TransactionAssetId"
        amount:
          $ref: "#/components/schemas/PositiveDecimalString"
        currency:
          $ref: "#/components/schemas/TransactionCurrency"
        effectiveAt:
          $ref: "#/components/schemas/EffectiveAt"
        note:
          $ref: "#/components/schemas/TransactionNote"
        externalReference:
          $ref: "#/components/schemas/TransactionExternalReference"
      description: DIVIDEND requires assetId and amount; quantity, unitPrice, and fee are forbidden.
    DepositTransactionCommand:
      type: object
      additionalProperties: false
      required: [kind, amount, currency, effectiveAt]
      properties:
        kind:
          type: string
          const: DEPOSIT
        amount:
          $ref: "#/components/schemas/PositiveDecimalString"
        currency:
          $ref: "#/components/schemas/TransactionCurrency"
        effectiveAt:
          $ref: "#/components/schemas/EffectiveAt"
        note:
          $ref: "#/components/schemas/TransactionNote"
        externalReference:
          $ref: "#/components/schemas/TransactionExternalReference"
      description: DEPOSIT is a portfolio cash event. assetId, quantity, unitPrice, and fee are forbidden.
    WithdrawalTransactionCommand:
      type: object
      additionalProperties: false
      required: [kind, amount, currency, effectiveAt]
      properties:
        kind:
          type: string
          const: WITHDRAWAL
        amount:
          $ref: "#/components/schemas/PositiveDecimalString"
        currency:
          $ref: "#/components/schemas/TransactionCurrency"
        effectiveAt:
          $ref: "#/components/schemas/EffectiveAt"
        note:
          $ref: "#/components/schemas/TransactionNote"
        externalReference:
          $ref: "#/components/schemas/TransactionExternalReference"
      description: WITHDRAWAL is a portfolio cash event. assetId, quantity, unitPrice, and fee are forbidden.
    FeeTransactionCommand:
      type: object
      additionalProperties: false
      required: [kind, amount, currency, effectiveAt]
      properties:
        kind:
          type: string
          const: FEE
        amount:
          $ref: "#/components/schemas/PositiveDecimalString"
        currency:
          $ref: "#/components/schemas/TransactionCurrency"
        effectiveAt:
          $ref: "#/components/schemas/EffectiveAt"
        note:
          $ref: "#/components/schemas/TransactionNote"
        externalReference:
          $ref: "#/components/schemas/TransactionExternalReference"
      description: FEE is a standalone portfolio cash event. assetId, quantity, unitPrice, and fee are forbidden.
    TransactionCommand:
      oneOf:
        - $ref: "#/components/schemas/BuyTransactionCommand"
        - $ref: "#/components/schemas/SellTransactionCommand"
        - $ref: "#/components/schemas/DividendTransactionCommand"
        - $ref: "#/components/schemas/DepositTransactionCommand"
        - $ref: "#/components/schemas/WithdrawalTransactionCommand"
        - $ref: "#/components/schemas/FeeTransactionCommand"
      discriminator:
        propertyName: kind
        mapping:
          BUY: "#/components/schemas/BuyTransactionCommand"
          SELL: "#/components/schemas/SellTransactionCommand"
          DIVIDEND: "#/components/schemas/DividendTransactionCommand"
          DEPOSIT: "#/components/schemas/DepositTransactionCommand"
          WITHDRAWAL: "#/components/schemas/WithdrawalTransactionCommand"
          FEE: "#/components/schemas/FeeTransactionCommand"
      description: >-
        Complete user-creatable command. REVERSAL and ADJUSTMENT are
        structurally unavailable. portfolioId and owner identity are route or
        server-derived only and are forbidden in this body.
    TransactionCorrectionCommand:
      type: object
      additionalProperties: false
      required: [replacement]
      properties:
        replacement:
          $ref: "#/components/schemas/TransactionCommand"
      description: >-
        Complete replacement command for the path target. It cannot submit a
        REVERSAL, cannot mutate the original, and cannot carry target IDs,
        portfolio IDs, ownership, or idempotency fields in the body.
    TransactionCorrectionLinks:
      type: object
      additionalProperties: false
      required:
        [
          reversesTransactionId,
          replacesTransactionId,
          reversalTransactionId,
          replacementTransactionId,
        ]
      properties:
        reversesTransactionId:
          anyOf:
            - $ref: "#/components/schemas/TransactionIdValue"
            - type: "null"
          description: Original transaction neutralized by this internal REVERSAL record.
        replacesTransactionId:
          anyOf:
            - $ref: "#/components/schemas/TransactionIdValue"
            - type: "null"
          description: Original transaction replaced by this public replacement record.
        reversalTransactionId:
          anyOf:
            - $ref: "#/components/schemas/TransactionIdValue"
            - type: "null"
          description: Direct internal reversal created when this Transaction was corrected.
        replacementTransactionId:
          anyOf:
            - $ref: "#/components/schemas/TransactionIdValue"
            - type: "null"
          description: Direct public replacement created when this Transaction was corrected.
      description: >-
        Immutable direct correction links. A replacement can later be corrected,
        so replacesTransactionId can coexist with reversalTransactionId and
        replacementTransactionId; this supports correction chains.
    TransactionIdValue:
      type: string
      minLength: 1
      maxLength: 128
      description: Immutable opaque Transaction identifier.
    PortfolioSequence:
      type: string
      pattern: "^[1-9][0-9]*$"
      description: Server-assigned immutable Portfolio-local sequence used only for stable ledger ordering.
    Transaction:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          assetId,
          quantity,
          unitPrice,
          fee,
          amount,
          currency,
          effectiveAt,
          portfolioSequence,
          note,
          externalReference,
          correctionLinks,
          createdAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/TransactionIdValue"
        kind:
          $ref: "#/components/schemas/TransactionVisibleKind"
        assetId:
          anyOf:
            - $ref: "#/components/schemas/TransactionAssetId"
            - type: "null"
        quantity:
          anyOf:
            - $ref: "#/components/schemas/PositiveDecimalString"
            - type: "null"
        unitPrice:
          anyOf:
            - $ref: "#/components/schemas/PositiveDecimalString"
            - type: "null"
        fee:
          anyOf:
            - $ref: "#/components/schemas/NonNegativeDecimalString"
            - type: "null"
          description: Accepted attached trade fee; zero when a BUY or SELL omitted fee, null for non-trade kinds.
        amount:
          anyOf:
            - $ref: "#/components/schemas/PositiveDecimalString"
            - type: "null"
        currency:
          $ref: "#/components/schemas/TransactionCurrency"
        effectiveAt:
          $ref: "#/components/schemas/EffectiveAt"
        portfolioSequence:
          $ref: "#/components/schemas/PortfolioSequence"
        note:
          anyOf:
            - $ref: "#/components/schemas/TransactionNote"
            - type: "null"
        externalReference:
          anyOf:
            - $ref: "#/components/schemas/TransactionExternalReference"
            - type: "null"
        correctionLinks:
          $ref: "#/components/schemas/TransactionCorrectionLinks"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
      description: >-
        Immutable public ledger record. It contains accepted financial facts and
        direct correction links only; it never exposes ownership, idempotency,
        audit, outbox, provider, holding, cost-basis, or valuation state.
    TransactionCorrectionResult:
      type: object
      additionalProperties: false
      required: [original, reversal, replacement]
      properties:
        original:
          $ref: "#/components/schemas/Transaction"
        reversal:
          $ref: "#/components/schemas/Transaction"
        replacement:
          $ref: "#/components/schemas/Transaction"
      description: Atomic correction result. original, reversal, and replacement identify one unambiguous immutable relationship.
    TransactionListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        nextCursor:
          anyOf:
            - $ref: "#/components/schemas/TransactionCursorValue"
            - type: "null"
          description: Opaque cursor for the next page, or null when history is exhausted.
    TransactionCursorValue:
      type: string
      minLength: 4
      maxLength: 512
      pattern: "^v1\\.[A-Za-z0-9_-]{1,509}$"
      description: Versioned opaque Transaction history cursor; clients must return it unchanged.
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [alive, ready]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        correlationId:
          $ref: "#/components/schemas/CorrelationIdValue"
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - REGISTRATION_REJECTED
        - AUTHENTICATION_FAILED
        - SESSION_REFRESH_REJECTED
        - ACCESS_TOKEN_INVALID
        - BROWSER_SECURITY_REJECTED
        - RATE_LIMIT_EXCEEDED
        - AUTH_SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
        - NOT_READY
        - HTTP_ERROR
        - NOT_FOUND
        - PORTFOLIO_NAME_CONFLICT
        - PORTFOLIO_NOT_FOUND
        - PORTFOLIO_ARCHIVED
        - ASSET_NOT_FOUND
        - INVALID_IDEMPOTENCY_KEY
        - INVALID_TRANSACTION_FIELDS
        - INVALID_DECIMAL
        - INVALID_EFFECTIVE_AT
        - UNSUPPORTED_TRANSACTION_KIND
        - ASSET_FINANCIALLY_INELIGIBLE
        - UNSUPPORTED_TRANSACTION_CURRENCY
        - INSUFFICIENT_ORDERED_ASSET_QUANTITY
        - INVALID_BACKDATED_LEDGER
        - IDEMPOTENCY_CONFLICT
        - TRANSACTION_ALREADY_CORRECTED
        - TRANSACTION_NOT_FOUND
    CorrelationIdValue:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9._-]+$"
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 UTC instant.
  responses:
    InvalidRequest:
      description: Request validation failed. Public code is INVALID_REQUEST.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RegistrationRejected:
      description: >-
        Registration could not be completed. Public code is
        REGISTRATION_REJECTED and does not confirm whether an account exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AuthenticationFailed:
      description: >-
        Authentication failed. Public code is AUTHENTICATION_FAILED for unknown
        email, disabled account, and incorrect password without distinction.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RefreshRejected:
      description: >-
        Refresh was rejected. Public code is SESSION_REFRESH_REJECTED for
        missing, expired, revoked, replaced, or replayed refresh credentials;
        security internals are not disclosed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Set-Cookie:
          $ref: "#/components/headers/ClearRefreshCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AccessTokenUnauthorized:
      description: Access token is absent or invalid. Public code is ACCESS_TOKEN_INVALID.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BrowserSecurityRejected:
      description: >-
        Browser security validation failed. Public code is
        BROWSER_SECURITY_REJECTED; origin or CSRF internals are not disclosed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Rate limit exceeded. Public code is RATE_LIMIT_EXCEEDED.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalFailure:
      description: Internal failure. Public code is INTERNAL_ERROR.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AuthServiceUnavailable:
      description: >-
        Authentication dependency is unavailable. Public code is
        AUTH_SERVICE_UNAVAILABLE.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PortfolioNameConflict:
      description: >-
        The authenticated owner already has an ACTIVE Portfolio with the
        requested normalized name. Public code is PORTFOLIO_NAME_CONFLICT; no
        persistence constraint details are disclosed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PortfolioNotFound:
      description: >-
        Portfolio is absent or is not owned by the authenticated principal.
        An unrepresentable opaque route value has the same public result.
        Public code is PORTFOLIO_NOT_FOUND for all cases and does not disclose
        cross-owner resource existence or internal identifier details.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PortfolioArchived:
      description: >-
        The requested mutation is not permitted because the owned Portfolio is
        archived. Public code is PORTFOLIO_ARCHIVED.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AssetNotFound:
      description: >-
        The requested canonical Asset is absent or unsupported. Public code is
        ASSET_NOT_FOUND; internal catalog lifecycle details are not disclosed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidTransactionRequest:
      description: >-
        Transaction request validation failed. Public code is INVALID_REQUEST,
        INVALID_IDEMPOTENCY_KEY, INVALID_TRANSACTION_FIELDS, or INVALID_DECIMAL
        according to the invalid transport component; no parser, schema, or
        internal identifier details are disclosed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TransactionCommandRejected:
      description: >-
        A syntactically valid Transaction command is not permitted. Public code
        is UNSUPPORTED_TRANSACTION_KIND, ASSET_NOT_FOUND,
        ASSET_FINANCIALLY_INELIGIBLE,
        UNSUPPORTED_TRANSACTION_CURRENCY, INVALID_EFFECTIVE_AT,
        INSUFFICIENT_ORDERED_ASSET_QUANTITY, INVALID_BACKDATED_LEDGER, or
        PORTFOLIO_ARCHIVED. Asset catalog/provider, ledger replay, and
        persistence internals are not disclosed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IdempotencyConflict:
      description: >-
        Idempotency-Key was previously used in this command scope with a
        different command. Public code is IDEMPOTENCY_CONFLICT; fingerprints,
        prior request contents, and persistence internals are not disclosed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TransactionCorrectionConflict:
      description: >-
        The correction cannot be accepted. Public code is IDEMPOTENCY_CONFLICT
        for different-command key reuse or TRANSACTION_ALREADY_CORRECTED when
        the target has a direct reversal. Internal correction state is not
        disclosed beyond the safe public result.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TransactionNotFound:
      description: >-
        Transaction is absent, not in the route Portfolio, not owned by the
        authenticated principal, or cannot be represented from the opaque path
        value. Public code is TRANSACTION_NOT_FOUND for all cases and does not
        disclose cross-owner or internal identifier details.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

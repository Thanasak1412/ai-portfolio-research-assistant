name: portfolio-research-bootstrap

x-backend-environment: &backend-environment
  APP_ENV: ${COMPOSE_APP_ENV:-development}
  HTTP_HOST: 0.0.0.0
  HTTP_PORT: 8080
  DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://portfolio:portfolio_local_only@postgres:5432/portfolio?sslmode=disable}
  DB_MAX_CONNS: 10
  DB_MIN_CONNS: 1
  DB_CONNECT_TIMEOUT: 5s
  LOG_LEVEL: info
  SHUTDOWN_TIMEOUT: 10s
  WORKER_HEARTBEAT_INTERVAL: 30s
  AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-}
  AUTH_JWT_ACTIVE_KID: ${AUTH_JWT_ACTIVE_KID:-}
  AUTH_JWT_ACTIVE_PRIVATE_KEY_B64: ${AUTH_JWT_ACTIVE_PRIVATE_KEY_B64:-}
  AUTH_JWT_VERIFICATION_KEYS_JSON: ${AUTH_JWT_VERIFICATION_KEYS_JSON:-}
  AUTH_JWT_LOCAL_KEY_RING_PATH: ${AUTH_JWT_LOCAL_KEY_RING_PATH:-}
  AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-}
  AUTH_TRUSTED_HTTPS_PROXY_CIDRS: ${AUTH_TRUSTED_HTTPS_PROXY_CIDRS:-}
  AUTH_NETWORK_HMAC_KEY: ${AUTH_NETWORK_HMAC_KEY:-}
  AUTH_RATE_LIMIT_HMAC_KEY: ${AUTH_RATE_LIMIT_HMAC_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_local_only
    ports:
      - "5432:5432"
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio_test
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_test_local_only
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - test-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: migrator
    command: ["-dir", "/migrations", "postgres", "${COMPOSE_DATABASE_URL:-postgres://portfolio:portfolio_local_only@postgres:5432/portfolio?sslmode=disable}", "up"]
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database

  migrate-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: migrator
    command: ["-dir", "/migrations", "postgres", "postgres://portfolio:portfolio_test_local_only@postgres-test:5432/portfolio_test?sslmode=disable", "up"]
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - test-database

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    environment: *backend-environment
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      proxy-api:
      database:
      test-database:
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: worker
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
      - test-database
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: development
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://app.localhost:3443/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - frontend

  auth-proxy:
    profiles: ["auth-https"]
    image: caddy:2.8.4-alpine
    ports:
      - "3443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${AUTH_TLS_DIR:-./.local/auth-tls}:/tls:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      frontend:
      proxy-api:
        ipv4_address: 172.30.20.2

volumes:
  portfolio_postgres_data:

networks:
  frontend:
  database:
    internal: true
  test-database:
    internal: true
  proxy-api:
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/29

version: "2"
sql:
  - engine: "postgresql"
    schema: "backend/migrations"
    queries: "backend/queries/platform"
    gen:
      go:
        package: "sqlcgen"
        out: "backend/internal/platform/database/sqlcgen"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: "postgresql"
    schema: "backend/migrations"
    queries: "backend/queries/identity"
    gen:
      go:
        package: "sqlcgen"
        out: "backend/internal/identity/infrastructure/database/sqlcgen"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        omit_unused_structs: true

name: bootstrap-quality-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: test -z "$(gofmt -l backend)"
      - run: go vet ./...
      - run: sh scripts/check-module-boundaries.sh
      - run: go test ./...
      - run: go build ./backend/cmd/api
      - run: go build ./backend/cmd/worker
      - uses: golang/govulncheck-action@v1

  contracts-and-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:lint
      - run: pnpm contract:generate
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.28.0
      - run: sqlc generate
      - run: git diff --exit-code -- packages/api-contracts/generated backend/internal/platform/database/sqlcgen

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio_test_local_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://portfolio:portfolio_test_local_only@localhost:5433/portfolio_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: go run github.com/pressly/goose/v3/cmd/goose@v3.26.0 -dir backend/migrations postgres "$TEST_DATABASE_URL" up
      - run: go test -tags=integration ./backend/internal/platform/database

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @portfolio/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d postgres postgres-test api worker web
      - run: curl --fail --retry 20 --retry-delay 2 http://localhost:8080/api/v1/health/ready
      - run: curl --fail --retry 20 --retry-delay 2 http://localhost:3000
      - if: always()
        run: docker compose down -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
